<div class="chat-input">
    <button type="button" class="chat-input-btn" onclick="document.getElementById('imageInput').click()" title="ส่งรูปภาพ">📷</button>
    
    <input type="text" id="msgInput" placeholder="พิมพ์ข้อความ..." onkeydown="if(event.key === 'Enter') sendPrivateMessage()">
    
    <button type="button" class="chat-input-btn post-btn" onclick="handlePostMessage()" title="โพสต์ข้อความ">
        📌 โพสต์
    </button>

    <button type="button" class="chat-input-btn send-btn" onclick="sendPrivateMessage()" title="ส่ง">➤</button>
</div>
