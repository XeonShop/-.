<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Realtime Glass Chat</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
body {
    min-height: 100vh; display: flex; justify-content: center; align-items: center;
    background: linear-gradient(135deg, #080b35, #11136c, #080b35); color: #fff; padding: 20px;
}
.chat-window {
    width: 100%; max-width: 480px; height: 600px;
    background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 24px;
    display: flex; flex-direction: column; overflow: hidden;
}
.chat-header {
    padding: 18px 24px; background: rgba(255, 255, 255, 0.03);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}
.messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.message { display: flex; flex-direction: column; max-width: 80%; }
.message.other { align-self: flex-start; }
.message.me { align-self: flex-end; }
.sender { font-size: 11px; color: #a78bfa; margin-bottom: 2px; }
.bubble { padding: 10px 14px; border-radius: 16px; font-size: 14px; word-break: break-word; }
.message.other .bubble { background: rgba(255, 255, 255, 0.1); color: #fff; border-bottom-left-radius: 4px; }
.message.me .bubble { background: linear-gradient(135deg, #7c3aed, #2563eb); color: #fff; border-bottom-right-radius: 4px; }
.input-area { padding: 16px; background: rgba(0, 0, 0, 0.15); border-top: 1px solid rgba(255, 255, 255, 0.08); }
.input-box { display: flex; gap: 8px; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 20px; padding: 6px; }
.input-box input { flex: 1; background: transparent; border: none; outline: none; color: #fff; padding-left: 10px; }
.send-btn { width: 36px; height: 36px; border: none; border-radius: 50%; background: #7c3aed; color: white; cursor: pointer; }
</style>
</head>
<body>

<div class="chat-window">
    <div class="chat-header"><h3>💬 Realtime Chat</h3></div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
        <div class="input-box">
            <input type="text" id="userInput" placeholder="พิมพ์ข้อความ..." onkeydown="if(event.key === 'Enter') sendMsg()">
            <button class="send-btn" onclick="sendMsg()">➤</button>
        </div>
    </div>
</div>

<!-- โหลด Firebase SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

// 1. ตั้งค่า Firebase (นำค่ามาจากโปรเจกต์ Firebase ของคุณ)
const firebaseConfig = {
    databaseURL: "https://YOUR_PROJECT_ID.firebaseio.com" // ใส่ URL ฐานข้อมูลของคุณที่นี่
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const chatRef = ref(db, "chats");

// สุ่มสร้าง ID ผู้ใช้ชั่วคราว
const myId = "User_" + Math.floor(Math.random() * 1000);

// 2. ฟังก์ชันส่งข้อความไปหา Server
window.sendMsg = function() {
    const input = document.getElementById("userInput");
    const text = input.value.trim();
    if (text !== "") {
        push(chatRef, { sender: myId, text: text });
        input.value = "";
    }
};

// 3. รอรับข้อความใหม่เมื่อคนอื่นพิมพ์ส่งเข้ามา
onChildAdded(chatRef, (snapshot) => {
    const data = snapshot.val();
    const messages = document.getElementById("messages");
    
    const msgDiv = document.createElement("div");
    const isMe = data.sender === myId;
    msgDiv.className = `message ${isMe ? 'me' : 'other'}`;
    
    msgDiv.innerHTML = `
        ${!isMe ? `<div class="sender">${data.sender}</div>` : ''}
        <div class="bubble">${escapeHTML(data.text)}</div>
    `;
    
    messages.appendChild(msgDiv);
    messages.scrollTop = messages.scrollHeight;
});

function escapeHTML(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
}
</script>

</body>
</html>
