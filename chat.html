<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Chat</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, sans-serif;
    background:#0b1020;
    color:white;
}

/* HEADER */
header{
    height:70px;
    background:linear-gradient(135deg,#111936,#25135c);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 30px;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 3px 15px #0008;
}

.logo{
    font-size:25px;
    font-weight:bold;
    color:#00d4ff;
}

nav{
    display:flex;
    gap:10px;
}

nav button{
    border:0;
    background:transparent;
    color:white;
    padding:12px 18px;
    border-radius:10px;
    cursor:pointer;
    font-size:15px;
}

nav button:hover{
    background:#ffffff18;
}

/* PAGES */
.page{
    display:none;
    padding:30px;
}

.page.active{
    display:block;
}

/* HOME */
.hero{
    min-height:500px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.hero h1{
    font-size:55px;
    margin-bottom:15px;
    background:linear-gradient(90deg,#00d4ff,#a855f7);
    -webkit-background-clip:text;
    color:transparent;
}

.hero p{
    color:#b8c0d9;
    font-size:18px;
    margin-bottom:30px;
}

.main-btn{
    border:0;
    background:linear-gradient(90deg,#00bfff,#7c3aed);
    color:white;
    padding:15px 30px;
    border-radius:12px;
    cursor:pointer;
    font-size:17px;
}

/* BOX */
.box{
    max-width:1000px;
    margin:auto;
    background:#11182d;
    border:1px solid #273253;
    border-radius:18px;
    padding:25px;
}

.title{
    font-size:28px;
    margin-bottom:20px;
}

/* SEARCH */
.search{
    width:100%;
    padding:14px;
    background:#080d1b;
    color:white;
    border:1px solid #303b61;
    border-radius:10px;
    outline:none;
    margin-bottom:20px;
}

/* FRIENDS */
.friend{
    display:flex;
    align-items:center;
    gap:15px;
    background:#0c1327;
    padding:15px;
    border-radius:12px;
    margin-bottom:10px;
}

.avatar{
    width:50px;
    height:50px;
    border-radius:50%;
    object-fit:cover;
    background:#263352;
}

.friend-info{
    flex:1;
}

.friend-name{
    font-weight:bold;
}

.status{
    color:#8e9ab9;
    font-size:13px;
    margin-top:4px;
}

.small-btn{
    border:0;
    padding:9px 14px;
    border-radius:8px;
    cursor:pointer;
    color:white;
    background:#2563eb;
}

.green{
    background:#16a34a;
}

.red{
    background:#dc2626;
}

/* CHAT */
.chat-container{
    max-width:1100px;
    height:calc(100vh - 130px);
    margin:auto;
    display:flex;
    background:#11182d;
    border-radius:18px;
    overflow:hidden;
    border:1px solid #273253;
}

.chat-friends{
    width:280px;
    border-right:1px solid #273253;
    overflow-y:auto;
    padding:15px;
}

.chat-user{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px;
    border-radius:10px;
    cursor:pointer;
    margin-bottom:5px;
}

.chat-user:hover,
.chat-user.selected{
    background:#26345e;
}

.chat-user .avatar{
    width:42px;
    height:42px;
}

.chat-main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
}

.chat-header{
    padding:15px 20px;
    border-bottom:1px solid #273253;
    font-weight:bold;
}

.chat-messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:10px;
    scroll-behavior:smooth;
}

/* MESSAGE */
.message{
    max-width:70%;
    padding:10px 14px;
    border-radius:15px;
    word-break:break-word;
}

.message.me{
    align-self:flex-end;
    background:#2563eb;
    border-bottom-right-radius:4px;
}

.message.other{
    align-self:flex-start;
    background:#252e48;
    border-bottom-left-radius:4px;
}

.message img{
    max-width:300px;
    max-height:300px;
    border-radius:10px;
    cursor:pointer;
    display:block;
}

.time{
    font-size:10px;
    opacity:.6;
    margin-top:4px;
}

/* CHAT INPUT */
.chat-input{
    padding:12px;
    border-top:1px solid #273253;
    display:flex;
    gap:8px;
}

.chat-input input{
    flex:1;
    padding:13px;
    border-radius:10px;
    border:1px solid #303b61;
    background:#080d1b;
    color:white;
    outline:none;
}

.chat-input button{
    border:0;
    border-radius:10px;
    padding:0 15px;
    cursor:pointer;
    color:white;
    background:#2563eb;
}

.image-btn{
    background:#7c3aed !important;
}

/* SCROLL BUTTONS */
.scroll-controls{
    position:absolute;
    right:25px;
    bottom:85px;
    display:flex;
    flex-direction:column;
    gap:5px;
}

.scroll-controls button{
    width:38px;
    height:38px;
    border:0;
    border-radius:50%;
    background:#26345e;
    color:white;
    cursor:pointer;
    font-size:18px;
}

/* PROFILE */
.profile{
    max-width:500px;
    margin:auto;
    text-align:center;
}

.profile-avatar{
    width:110px;
    height:110px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid #2563eb;
    margin-bottom:15px;
}

.profile input{
    width:100%;
    padding:12px;
    margin:7px 0;
    border-radius:9px;
    border:1px solid #303b61;
    background:#080d1b;
    color:white;
}

.profile button{
    width:100%;
    padding:12px;
    border:0;
    border-radius:9px;
    background:#2563eb;
    color:white;
    cursor:pointer;
    margin-top:10px;
}

/* LOGIN */
.overlay{
    position:fixed;
    inset:0;
    background:#000b;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:500;
}

.login-box{
    width:370px;
    max-width:90%;
    background:#11182d;
    border:1px solid #34416a;
    border-radius:18px;
    padding:25px;
}

.login-box h2{
    text-align:center;
    margin-bottom:20px;
}

.login-box input{
    width:100%;
    padding:13px;
    margin-bottom:10px;
    border-radius:9px;
    border:1px solid #303b61;
    background:#080d1b;
    color:white;
    outline:none;
}

.login-box button{
    width:100%;
    padding:12px;
    border:0;
    border-radius:9px;
    margin-top:5px;
    cursor:pointer;
    color:white;
    background:#2563eb;
}

.switch{
    text-align:center;
    margin-top:15px;
    color:#00d4ff;
    cursor:pointer;
}

.close{
    float:right;
    cursor:pointer;
    font-size:22px;
}

/* IMAGE ZOOM */
.zoom-modal{
    position:fixed;
    inset:0;
    background:#000e;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:1000;
}

.zoom-content{
    max-width:90%;
    max-height:80%;
    overflow:auto;
    display:flex;
    align-items:center;
    justify-content:center;
}

.zoom-content img{
    max-width:none;
    max-height:none;
    transform-origin:center;
    transition:.2s;
    border-radius:10px;
}

.zoom-close{
    position:absolute;
    top:20px;
    right:25px;
    font-size:35px;
    color:white;
    background:none;
    border:0;
    cursor:pointer;
}

.zoom-buttons{
    position:absolute;
    bottom:25px;
    display:flex;
    gap:8px;
}

.zoom-buttons button{
    border:0;
    background:#26345e;
    color:white;
    padding:12px 18px;
    border-radius:10px;
    cursor:pointer;
}

/* MOBILE */
@media(max-width:700px){

    header{
        padding:0 12px;
    }

    .logo{
        font-size:19px;
    }

    nav button{
        padding:8px;
        font-size:12px;
    }

    .hero h1{
        font-size:38px;
    }

    .page{
        padding:15px;
    }

    .chat-friends{
        width:80px;
    }

    .chat-user span{
        display:none;
    }

    .message{
        max-width:85%;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">💬 Student Chat</div>

    <nav>
        <button onclick="showPage('home')">หน้าแรก</button>
        <button onclick="showPage('friends')">👥 เพื่อน</button>
        <button onclick="showPage('chat')">💬 แชท</button>
        <button onclick="showPage('profile')">👤 โปรไฟล์</button>
    </nav>
</header>


<!-- HOME -->
<section id="home" class="page active">
    <div class="hero">
        <h1>Student Chat</h1>
        <p>ห้องพูดคุยสำหรับนักเรียน พูดคุย ถามงาน และเพิ่มเพื่อนได้</p>

        <button class="main-btn" onclick="openLogin()">
            🚀 เริ่มใช้งาน
        </button>
    </div>
</section>


<!-- FRIENDS -->
<section id="friends" class="page">

    <div class="box">

        <div class="title">👥 ระบบเพื่อน</div>

        <input
            id="friendSearch"
            class="search"
            placeholder="ค้นหาชื่อผู้ใช้..."
            oninput="searchUsers()"
        >

        <div id="usersList">
            <p style="color:#8e9ab9">
                กรุณาเข้าสู่ระบบก่อน
            </p>
        </div>

    </div>

</section>


<!-- CHAT -->
<section id="chat" class="page">

    <div class="chat-container">

        <div class="chat-friends">

            <h3 style="margin-bottom:15px;">
                💬 เพื่อน
            </h3>

            <div id="chatFriendsList">
                <p style="color:#8e9ab9">
                    ยังไม่มีเพื่อน
                </p>
            </div>

        </div>

        <div class="chat-main">

            <div class="chat-header" id="chatTitle">
                เลือกเพื่อนเพื่อเริ่มแชท
            </div>

            <div
                class="chat-messages"
                id="chatMessages"
            ></div>

            <div class="scroll-controls">

                <button onclick="scrollChat(-400)">
                    ↑
                </button>

                <button onclick="scrollChat(400)">
                    ↓
                </button>

            </div>

            <div class="chat-input">

                <input
                    id="messageInput"
                    placeholder="พิมพ์ข้อความ..."
                    onkeydown="if(event.key==='Enter') sendMessage()"
                >

                <input
                    type="file"
                    id="imageInput"
                    accept="image/*"
                    hidden
                    onchange="sendImage()"
                >

                <button
                    class="image-btn"
                    onclick="document.getElementById('imageInput').click()"
                >
                    🖼️
                </button>

                <button onclick="sendMessage()">
                    ส่ง
                </button>

            </div>

        </div>

    </div>

</section>


<!-- PROFILE -->
<section id="profile" class="page">

    <div class="box profile">

        <div class="title">
            👤 โปรไฟล์
        </div>

        <img
            id="profileAvatar"
            class="profile-avatar"
            src=""
        >

        <input
            type="file"
            id="avatarInput"
            accept="image/*"
            onchange="changeAvatar()"
        >

        <input
            id="profileUsername"
            placeholder="ชื่อผู้ใช้"
        >

        <input
            id="profileStatus"
            placeholder="สถานะ"
        >

        <button onclick="saveProfile()">
            💾 บันทึกโปรไฟล์
        </button>

        <button
            class="red"
            onclick="logout()"
        >
            🚪 ออกจากระบบ
        </button>

    </div>

</section>


<!-- LOGIN -->
<div class="overlay" id="loginOverlay">

    <div class="login-box">

        <span
            class="close"
            onclick="closeLogin()"
        >
            ×
        </span>

        <h2 id="loginTitle">
            🔐 เข้าสู่ระบบ
        </h2>

        <input
            id="usernameInput"
            placeholder="ชื่อผู้ใช้"
        >

        <input
            id="passwordInput"
            type="password"
            placeholder="รหัสผ่าน"
        >

        <button onclick="login()">
            เข้าสู่ระบบ
        </button>

        <button
            id="registerButton"
            onclick="register()"
            style="display:none;background:#7c3aed;"
        >
            สมัครสมาชิก
        </button>

        <div
            class="switch"
            onclick="toggleRegister()"
            id="switchText"
        >
            ยังไม่มีบัญชี? สมัครสมาชิก
        </div>

    </div>

</div>


<!-- IMAGE ZOOM -->
<div
    class="zoom-modal"
    id="zoomModal"
    onclick="closeZoom(event)"
>

    <button
        class="zoom-close"
        onclick="closeZoom()"
    >
        ×
    </button>

    <div class="zoom-content">

        <img
            id="zoomImage"
            src=""
        >

    </div>

    <div class="zoom-buttons">

        <button onclick="zoom(-0.2)">
            −
        </button>

        <button onclick="resetZoom()">
            100%
        </button>

        <button onclick="zoom(0.2)">
            +
        </button>

    </div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import {
    getDatabase,
    ref,
    set,
    get,
    push,
    onValue,
    off,
    remove,
    runTransaction
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged,
    updateProfile,
    updateEmail
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


/* ================================
   FIREBASE CONFIG
================================ */

const firebaseConfig = {

    apiKey:
    "AIzaSyDaN-eSOQve7qn8MPHcOj4IeYWrt-7SwHk",

    authDomain:
    "xdhi13.firebaseapp.com",

    databaseURL:
    "https://mnht-84ae0-default-rtdb.firebaseio.com",

    projectId:
    "xdhi13",

    storageBucket:
    "xdhi13.firebasestorage.app",

    messagingSenderId:
    "1094865586143",

    appId:
    "1:1094865586143:web:6f1a7e79780ae918eba66a"
};


const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const auth = getAuth(app);


/* ================================
   VARIABLES
================================ */

let currentUser = null;

let selectedFriend = null;

let currentChatRef = null;

let zoomScale = 1;


/* ================================
   PAGE
================================ */

window.showPage = function(page){

    document
        .querySelectorAll(".page")
        .forEach(p =>
            p.classList.remove("active")
        );

    document
        .getElementById(page)
        .classList.add("active");

    if(page === "friends"){
        searchUsers();
    }

    if(page === "chat"){
        loadFriends();
    }

};


/* ================================
   LOGIN MODAL
================================ */

let registerMode = false;

window.openLogin = function(){

    document.getElementById(
        "loginOverlay"
    ).style.display = "flex";

};

window.closeLogin = function(){

    document.getElementById(
        "loginOverlay"
    ).style.display = "none";

};

window.toggleRegister = function(){

    registerMode = !registerMode;

    document.getElementById(
        "loginTitle"
    ).textContent =
        registerMode
        ? "📝 สมัครสมาชิก"
        : "🔐 เข้าสู่ระบบ";

    document.getElementById(
        "registerButton"
    ).style.display =
        registerMode
        ? "block"
        : "none";

    document.querySelector(
        "#loginOverlay .login-box button"
    ).style.display =
        registerMode
        ? "none"
        : "block";

    document.getElementById(
        "switchText"
    ).textContent =
        registerMode
        ? "มีบัญชีแล้ว? เข้าสู่ระบบ"
        : "ยังไม่มีบัญชี? สมัครสมาชิก";

};


/* ================================
   USERNAME
================================ */

function normalizeUsername(username){

    return username
        .trim()
        .toLowerCase();

}

function usernameKey(username){

    return encodeURIComponent(
        normalizeUsername(username)
    );

}

function makeEmail(username){

    return (
        usernameKey(username)
        .replace(/%/g,"")
        .replace(/[^a-zA-Z0-9]/g,"")
        .slice(0,35)
        + "@studentchat.app"
    );

}


/* ================================
   REGISTER
================================ */

window.register = async function(){

    const username =
        document
        .getElementById("usernameInput")
        .value
        .trim();

    const password =
        document
        .getElementById("passwordInput")
        .value;


    if(username.length < 3){

        alert("ชื่อผู้ใช้ต้องมีอย่างน้อย 3 ตัวอักษร");

        return;
    }


    if(password.length < 6){

        alert("รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร");

        return;
    }


    if(
        !/^[a-zA-Z0-9ก-๙_-]+$/.test(username)
    ){

        alert(
            "ชื่อผู้ใช้ใช้ได้เฉพาะภาษาไทย อังกฤษ ตัวเลข _ และ -"
        );

        return;
    }


    const key =
        usernameKey(username);


    try{

        /* ป้องกันชื่อซ้ำ */

        const transaction =
            await runTransaction(
                ref(db,`usernames/${key}`),
                current => {

                    if(current !== null){
                        return;
                    }

                    return username;
                }
            );


        if(!transaction.committed){

            alert("ชื่อผู้ใช้นี้ถูกใช้แล้ว");

            return;
        }


        const email =
            makeEmail(username);


        let credential;


        try{

            credential =
                await createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                );

        }catch(error){

            await remove(
                ref(db,`usernames/${key}`)
            );

            throw error;

        }


        const user =
            credential.user;


        await set(
            ref(db,`users/${user.uid}`),
            {

                uid:user.uid,

                username:username,

                usernameKey:key,

                status:"ออนไลน์",

                avatar:"",

                createdAt:Date.now()

            }
        );


        alert("สมัครสมาชิกสำเร็จ 🎉");

        closeLogin();

        document.getElementById(
            "usernameInput"
        ).value = "";

        document.getElementById(
            "passwordInput"
        ).value = "";


    }catch(error){

        console.error(error);

        alert(
            "สมัครสมาชิกไม่สำเร็จ: "
            + error.message
        );

    }

};


/* ================================
   LOGIN
================================ */

window.login = async function(){

    const username =
        document
        .getElementById("usernameInput")
        .value
        .trim();

    const password =
        document
        .getElementById("passwordInput")
        .value;


    if(!username || !password){

        alert("กรุณากรอกข้อมูลให้ครบ");

        return;
    }


    try{

        const email =
            makeEmail(username);


        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );


        closeLogin();

        alert("เข้าสู่ระบบสำเร็จ ✅");


    }catch(error){

        console.error(error);

        alert(
            "ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง"
        );

    }

};


/* ================================
   AUTH STATE
================================ */

onAuthStateChanged(
    auth,
    async user => {

        currentUser = user;

        if(user){

            loadProfile();

            loadFriends();

        }

    }
);


/* ================================
   LOGOUT
================================ */

window.logout = async function(){

    await signOut(auth);

    selectedFriend = null;

    alert("ออกจากระบบแล้ว");

    showPage("home");

};


/* ================================
   SEARCH USERS
================================ */

window.searchUsers = async function(){

    if(!currentUser){

        document.getElementById(
            "usersList"
        ).innerHTML =
        "<p>กรุณาเข้าสู่ระบบก่อน</p>";

        return;
    }


    const search =
        document
        .getElementById("friendSearch")
        .value
        .toLowerCase();


    const snapshot =
        await get(
            ref(db,"users")
        );


    const list =
        document.getElementById(
            "usersList"
        );

    list.innerHTML = "";


    if(!snapshot.exists()){

        list.innerHTML =
        "<p>ยังไม่มีผู้ใช้</p>";

        return;
    }


    const users =
        snapshot.val();


    for(
        const uid in users
    ){

        if(uid === currentUser.uid)
            continue;


        const u =
            users[uid];


        if(
            search &&
            !u.username
            .toLowerCase()
            .includes(search)
        ){
            continue;
        }


        const div =
            document.createElement("div");

        div.className = "friend";


        div.innerHTML = `

            <img
                class="avatar"
                src="${u.avatar || defaultAvatar()}"
            >

            <div class="friend-info">

                <div class="friend-name">
                    ${escapeHtml(u.username)}
                </div>

                <div class="status">
                    ${escapeHtml(u.status || "")}
                </div>

            </div>

            <button
                class="small-btn"
                onclick="addFriend('${uid}')"
            >
                + เพิ่มเพื่อน
            </button>

        `;


        list.appendChild(div);

    }

};


/* ================================
   ADD FRIEND
================================ */

window.addFriend = async function(uid){

    if(!currentUser){

        openLogin();

        return;
    }


    const myUid =
        currentUser.uid;


    if(myUid === uid)
        return;


    const mySnapshot =
        await get(
            ref(db,`users/${myUid}`)
        );


    const myData =
        mySnapshot.val();


    await set(
        ref(
            db,
            `friendRequests/${uid}/${myUid}`
        ),
        {

            uid:myUid,

            username:myData.username,

            createdAt:Date.now()

        }
    );


    alert("ส่งคำขอเป็นเพื่อนแล้ว ✅");

};


/* ================================
   FRIENDS
================================ */

let friendsListener = null;

function loadFriends(){

    if(!currentUser)
        return;


    const friendsRef =
        ref(
            db,
            `friends/${currentUser.uid}`
        );


    if(friendsListener){

        off(
            friendsRef,
            "value",
            friendsListener
        );

    }


    friendsListener =
        onValue(
            friendsRef,
            async snapshot => {

                const list =
                    document.getElementById(
                        "chatFriendsList"
                    );


                list.innerHTML = "";


                if(!snapshot.exists()){

                    list.innerHTML =
                    "<p style='color:#8e9ab9'>ยังไม่มีเพื่อน</p>";

                    return;

                }


                const friends =
                    snapshot.val();


                for(
                    const uid in friends
                ){

                    const userSnapshot =
                        await get(
                            ref(db,`users/${uid}`)
                        );


                    if(
                        !userSnapshot.exists()
                    )
                        continue;


                    const user =
                        userSnapshot.val();


                    const div =
                        document.createElement(
                            "div"
                        );


                    div.className =
                        "chat-user";


                    div.onclick =
                        () => selectFriend(
                            uid,
                            user
                        );


                    div.innerHTML = `

                        <img
                            class="avatar"
                            src="${user.avatar || defaultAvatar()}"
                        >

                        <span>
                            ${escapeHtml(user.username)}
                        </span>

                    `;


                    list.appendChild(div);

                }

            }
        );

}


/* ================================
   ACCEPT FRIEND
================================ */

async function acceptFriend(
    fromUid
){

    if(!currentUser)
        return;


    const me =
        currentUser.uid;


    await set(
        ref(
            db,
            `friends/${me}/${fromUid}`
        ),
        true
    );


    await set(
        ref(
            db,
            `friends/${fromUid}/${me}`
        ),
        true
    );


    await remove(
        ref(
            db,
            `friendRequests/${me}/${fromUid}`
        )
    );


    alert("เพิ่มเพื่อนสำเร็จ 🎉");

}


/* ================================
   SELECT CHAT
================================ */

async function selectFriend(
    uid,
    user
){

    selectedFriend = user;

    selectedFriend.uid = uid;


    document.getElementById(
        "chatTitle"
    ).textContent =
        "💬 " + user.username;


    loadMessages();

}


window.selectFriend = selectFriend;


/* ================================
   CHAT ID
================================ */

function getChatId(
    uid1,
    uid2
){

    return [
        uid1,
        uid2
    ]
    .sort()
    .join("_");

}


/* ================================
   LOAD MESSAGES
================================ */

let messageListener = null;

function loadMessages(){

    if(!currentUser || !selectedFriend)
        return;


    const chatId =
        getChatId(
            currentUser.uid,
            selectedFriend.uid
        );


    const messagesRef =
        ref(
            db,
            `chats/${chatId}/messages`
        );


    if(messageListener){

        off(
            messagesRef,
            "value",
            messageListener
        );

    }


    messageListener =
        onValue(
            messagesRef,
            snapshot => {

                const area =
                    document.getElementById(
                        "chatMessages"
                    );


                const wasNearBottom =
                    area.scrollHeight -
                    area.scrollTop -
                    area.clientHeight
                    < 150;


                area.innerHTML = "";


                if(snapshot.exists()){

                    const messages =
                        snapshot.val();


                    Object
                    .values(messages)
                    .forEach(msg => {

                        renderMessage(
                            msg,
                            area
                        );

                    });

                }


                if(wasNearBottom){

                    setTimeout(
                        () => {

                            area.scrollTop =
                                area.scrollHeight;

                        },
                        30
                    );

                }

            }
        );

}


/* ================================
   RENDER MESSAGE
================================ */

function renderMessage(
    msg,
    area
){

    const div =
        document.createElement("div");


    div.className =
        "message " +
        (
            msg.senderId ===
            currentUser.uid
            ? "me"
            : "other"
        );


    if(msg.type === "image"){

        div.innerHTML = `

            <img
                src="${msg.data}"
                onclick="openZoom('${msg.data}')"
            >

            <div class="time">
                ${formatTime(msg.createdAt)}
            </div>

        `;

    }else{

        div.innerHTML = `

            <div>
                ${escapeHtml(msg.text)}
            </div>

            <div class="time">
                ${formatTime(msg.createdAt)}
            </div>

        `;

    }


    area.appendChild(div);

}


/* ================================
   SEND MESSAGE
================================ */

window.sendMessage = async function(){

    if(!currentUser){

        openLogin();

        return;
    }


    if(!selectedFriend){

        alert("กรุณาเลือกเพื่อนก่อน");

        return;
    }


    const input =
        document.getElementById(
            "messageInput"
        );


    const text =
        input.value.trim();


    if(!text)
        return;


    const chatId =
        getChatId(
            currentUser.uid,
            selectedFriend.uid
        );


    const newMessage =
        push(
            ref(
                db,
                `chats/${chatId}/messages`
            )
        );


    await set(
        newMessage,
        {

            senderId:
                currentUser.uid,

            senderName:
                currentUser.displayName || "ผู้ใช้",

            type:"text",

            text:text,

            createdAt:Date.now()

        }
    );


    input.value = "";

};


/* ================================
   SEND IMAGE
================================ */

window.sendImage = async function(){

    if(!currentUser){

        openLogin();

        return;
    }


    if(!selectedFriend){

        alert("กรุณาเลือกเพื่อนก่อน");

        return;
    }


    const input =
        document.getElementById(
            "imageInput"
        );


    const file =
        input.files[0];


    if(!file)
        return;


    if(file.size > 1500000){

        alert(
            "รูปใหญ่เกินไป กรุณาเลือกรูปไม่เกิน 1.5MB"
        );

        input.value = "";

        return;
    }


    const reader =
        new FileReader();


    reader.onload = async function(){

        const chatId =
            getChatId(
                currentUser.uid,
                selectedFriend.uid
            );


        const newMessage =
            push(
                ref(
                    db,
                    `chats/${chatId}/messages`
                )
            );


        await set(
            newMessage,
            {

                senderId:
                    currentUser.uid,

                senderName:
                    currentUser.displayName ||
                    "ผู้ใช้",

                type:"image",

                data:
                    reader.result,

                createdAt:
                    Date.now()

            }
        );

    };


    reader.readAsDataURL(file);

    input.value = "";

};


/* ================================
   SCROLL
================================ */

window.scrollChat = function(amount){

    const area =
        document.getElementById(
            "chatMessages"
        );


    area.scrollBy({

        top:amount,

        behavior:"smooth"

    });

};


/* ================================
   IMAGE ZOOM
================================ */

window.openZoom = function(src){

    const modal =
        document.getElementById(
            "zoomModal"
        );


    const image =
        document.getElementById(
            "zoomImage"
        );


    image.src = src;

    zoomScale = 1;

    image.style.transform =
        "scale(1)";


    modal.style.display =
        "flex";

};


window.closeZoom = function(event){

    if(
        event &&
        event.target.id !==
        "zoomModal"
    ){
        return;
    }


    document.getElementById(
        "zoomModal"
    ).style.display =
        "none";

};


window.zoom = function(amount){

    zoomScale += amount;


    if(zoomScale < .3)
        zoomScale = .3;


    if(zoomScale > 4)
        zoomScale = 4;


    document.getElementById(
        "zoomImage"
    ).style.transform =
        `scale(${zoomScale})`;

};


window.resetZoom = function(){

    zoomScale = 1;

    document.getElementById(
        "zoomImage"
    ).style.transform =
        "scale(1)";

};


/* ================================
   PROFILE
================================ */

async function loadProfile(){

    if(!currentUser)
        return;


    const snapshot =
        await get(
            ref(
                db,
                `users/${currentUser.uid}`
            )
        );


    if(!snapshot.exists())
        return;


    const user =
        snapshot.val();


    document.getElementById(
        "profileUsername"
    ).value =
        user.username || "";


    document.getElementById(
        "profileStatus"
    ).value =
        user.status || "";


    document.getElementById(
        "profileAvatar"
    ).src =
        user.avatar ||
        defaultAvatar();

}


/* ================================
   CHANGE AVATAR
================================ */

window.changeAvatar = function(){

    const file =
        document.getElementById(
            "avatarInput"
        ).files[0];


    if(!file)
        return;


    if(file.size > 1000000){

        alert(
            "รูปโปรไฟล์ใหญ่เกินไป"
        );

        return;
    }


    const reader =
        new FileReader();


    reader.onload = function(){

        document.getElementById(
            "profileAvatar"
        ).src =
            reader.result;

        document.getElementById(
            "profileAvatar"
        ).dataset.avatar =
            reader.result;

    };


    reader.readAsDataURL(file);

};


/* ================================
   SAVE PROFILE
================================ */

window.saveProfile = async function(){

    if(!currentUser){

        openLogin();

        return;
    }


    const username =
        document.getElementById(
            "profileUsername"
        ).value.trim();


    const status =
        document.getElementById(
            "profileStatus"
        ).value.trim();


    const avatar =
        document.getElementById(
            "profileAvatar"
        ).dataset.avatar ||
        document.getElementById(
            "profileAvatar"
        ).src;


    if(username.length < 3){

        alert(
            "ชื่อผู้ใช้ต้องมีอย่างน้อย 3 ตัว"
        );

        return;
    }


    try{

        const oldSnapshot =
            await get(
                ref(
                    db,
                    `users/${currentUser.uid}`
                )
            );


        const oldData =
            oldSnapshot.val();


        const oldUsername =
            oldData.username;


        if(
            normalizeUsername(username) !==
            normalizeUsername(oldUsername)
        ){

            const newKey =
                usernameKey(username);


            const transaction =
                await runTransaction(
                    ref(
                        db,
                        `usernames/${newKey}`
                    ),
                    current => {

                        if(current !== null)
                            return;

                        return username;

                    }
                );


            if(!transaction.committed){

                alert(
                    "ชื่อผู้ใช้นี้ถูกใช้แล้ว"
                );

                return;
            }


            try{

                await updateEmail(
                    currentUser,
                    makeEmail(username)
                );

            }catch(error){

                await remove(
                    ref(
                        db,
                        `usernames/${newKey}`
                    )
                );

                alert(
                    "ไม่สามารถเปลี่ยนชื่อได้ กรุณาเข้าสู่ระบบใหม่แล้วลองอีกครั้ง"
                );

                return;
            }


            await remove(
                ref(
                    db,
                    `usernames/${oldData.usernameKey}`
                )
            );


            await updateProfile(
                currentUser,
                {
                    displayName:username
                }
            );


            await set(
                ref(
                    db,
                    `users/${currentUser.uid}`
                ),
                {

                    ...oldData,

                    username:username,

                    usernameKey:newKey,

                    status:status,

                    avatar:avatar

                }
            );

        }else{

            await set(
                ref(
                    db,
                    `users/${currentUser.uid}/status`
                ),
                status
            );


            await set(
                ref(
                    db,
                    `users/${currentUser.uid}/avatar`
                ),
                avatar
            );

        }


        alert("บันทึกข้อมูลแล้ว ✅");


    }catch(error){

        console.error(error);

        alert(
            "เกิดข้อผิดพลาด: "
            + error.message
        );

    }

};


/* ================================
   DEFAULT AVATAR
================================ */

function defaultAvatar(){

    return "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(`
        <svg
            xmlns="http://www.w3.org/2000/svg"
            width="100"
            height="100"
        >
            <rect
                width="100"
                height="100"
                fill="#26345e"
            />
            <text
                x="50"
                y="62"
                text-anchor="middle"
                font-size="45"
                fill="white"
            >
                👤
            </text>
        </svg>
    `);

}


/* ================================
   ESCAPE HTML
================================ */

function escapeHtml(text){

    return String(text || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ================================
   TIME
================================ */

function formatTime(timestamp){

    if(!timestamp)
        return "";

    return new Date(timestamp)
        .toLocaleTimeString(
            "th-TH",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

}
