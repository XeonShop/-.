<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แอปพลิเคชันของฉัน - ระบบโพสต์</title>
    <style>
        /* ตั้งค่าพื้นฐาน */
        body {
            margin: 0;
            padding: 0;
            background-color: #0d1117;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            padding-bottom: 70px; /* เว้นที่ให้แถบเมนูด้านล่างไม่บังเนื้อหา */
        }

        /* ซ่อน/แสดง แท็บหน้าต่างๆ */
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        /* สไตล์สำหรับหน้าโพสต์ */
        .post-container {
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        .post-container h3 {
            margin-bottom: 15px;
            font-size: 18px;
        }

        .create-post-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .create-post-box textarea {
            width: 100%;
            height: 80px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: white;
            padding: 10px;
            resize: none;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
        }

        .submit-post-btn {
            margin-top: 10px;
            background: linear-gradient(135deg, #22c9ff, #7c3aed);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            display: block;
            margin-left: auto;
            transition: opacity 0.2s;
        }

        .submit-post-btn:hover {
            opacity: 0.9;
        }

        .feed-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .post-card {
            background: rgba(255, 255, 255, 0.07);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .post-header {
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }

        .post-body {
            font-size: 14px;
            word-break: break-word;
            white-space: pre-wrap;
        }

        /* สไตล์แถบเมนูด้านล่าง (Nav Bar) */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #161b22;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }

        .nav-item {
            background: transparent;
            border: none;
            color: #8b949e;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transition: color 0.2s;
        }

        .nav-item.active {
            color: #22c9ff;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- 1. หน้าแรก (Home) -->
    <div id="homeTab" class="tab-content">
        <div style="padding: 20px; text-align: center;">
            <h2>🏠 หน้าแรก</h2>
            <p>ยินดีต้อนรับสู่หน้าแรกของแอปพลิเคชัน</p>
        </div>
    </div>

    <!-- 2. หน้าเพื่อน (Friends) -->
    <div id="friendsTab" class="tab-content">
        <div style="padding: 20px; text-align: center;">
            <h2>👥 เพื่อน</h2>
            <p>รายชื่อเพื่อนของคุณจะแสดงที่นี่</p>
        </div>
    </div>

    <!-- 3. หน้าโพสต์ (Posts) - ค่าเริ่มต้นให้เปิดแสดงผลหน้านี้ -->
    <div id="postsTab" class="tab-content active">
        <div class="post-container">
            <h3>💬 ฟีดโพสต์สาธารณะ</h3>
            
            <!-- กล่องสำหรับพิมพ์สร้างโพสต์ใหม่ -->
            <div class="create-post-box">
                <textarea id="postContentInput" placeholder="คุณกำลังคิดอะไรอยู่..."></textarea>
                <button class="submit-post-btn" onclick="createNewPost()">โพสต์เลย</button>
            </div>

            <!-- พื้นที่แสดงรายการโพสต์ทั้งหมด -->
            <div id="feedList" class="feed-list">
                <!-- โพสต์ตัวอย่าง -->
                <div class="post-card">
                    <div class="post-header">
                        <strong>Admin</strong> <span style="font-size: 12px; color: #8b949e;">เมื่อสักครู่</span>
                    </div>
                    <div class="post-body">ยินดีต้อนรับสู่ระบบโพสต์ใหม่ล่าสุด! 🎉 ลองพิมพ์ข้อความแล้วกดโพสต์ดูได้เลยครับ</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 4. หน้าแชท (Chat) -->
    <div id="chatTab" class="tab-content">
        <div style="padding: 20px; text-align: center;">
            <h2>💬 แชท</h2>
            <p>ระบบสนทนาพูดคุย</p>
        </div>
    </div>

    <!-- 5. หน้าโปรไฟล์ (Profile) -->
    <div id="profileTab" class="tab-content">
        <div style="padding: 20px; text-align: center;">
            <h2>👤 โปรไฟล์</h2>
            <p>ข้อมูลส่วนตัวของผู้ใช้งาน</p>
        </div>
    </div>


    <!-- แถบเมนูด้านล่าง (Nav Bar ตามภาพตัวอย่างของคุณ) -->
    <div class="nav-bar">
        <button class="nav-item" onclick="switchTab('home', this)">
            <span>🏠</span> หน้าแรก
        </button>
        <button class="nav-item" onclick="switchTab('friends', this)">
            <span>👥</span> เพื่อน
        </button>
        <button class="nav-item active" onclick="switchTab('posts', this)">
            <span>📝</span> โพสต์
        </button>
        <button class="nav-item" onclick="switchTab('chat', this)">
            <span>💬</span> แชท
        </button>
        <button class="nav-item" onclick="switchTab('profile', this)">
            <span>👤</span> โปรไฟล์
        </button>
    </div>


    <!-- ส่วนของจาวาสคริปต์ (JavaScript) -->
    <script>
        // ฟังก์ชันสำหรับสลับหน้าแท็บ
        function switchTab(tabName, element) {
            // ซ่อนทุกหน้าแท็บ
            const tabs = ['home', 'friends', 'posts', 'chat', 'profile'];
            tabs.forEach(t => {
                let el = document.getElementById(t + 'Tab');
                if (el) el.classList.remove('active');
            });

            // แสดงหน้าแท็บที่ถูกเลือก
            let activeEl = document.getElementById(tabName + 'Tab');
            if (activeEl) activeEl.classList.add('active');

            // สลับสถานะปุ่มแอคทีฟที่เมนูด้านล่าง
            const navItems = document.querySelectorAll('.nav-item');
            navItems.forEach(item => item.classList.remove('active'));
            if (element) {
                element.classList.add('active');
            }
        }

        // ฟังก์ชันสร้างโพสต์ใหม่
        function createNewPost() {
            const input = document.getElementById("postContentInput");
            const text = input.value.trim();

            if (!text) {
                alert("กรุณากรอกข้อความก่อนโพสต์ครับ");
                return;
            }

            const feedList = document.getElementById("feedList");
            const newCard = document.createElement("div");
            newCard.className = "post-card";
            newCard.innerHTML = `
                <div class="post-header">
                    <strong>คุณ</strong> <span style="font-size: 12px; color: #8b949e;">เมื่อสักครู่</span>
                </div>
                <div class="post-body">${escapeHtml(text)}</div>
            `;

            // นำโพสต์ใหม่ไปไว้บนสุดของฟีด
            feedList.prepend(newCard); 
            
            // เคลียร์ช่องพิมพ์ข้อความ
            input.value = ""; 
        }

        // ฟังก์ชันป้องกัน XSS เบื้องต้นเพื่อความปลอดภัย
        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
