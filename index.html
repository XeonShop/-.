<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Maharnnoparam School</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,"Noto Sans Thai",sans-serif;
    background:#080b32;
    color:white;
}

/* ===== HEADER ===== */

.header{
    height:78px;
    background:#070922;
    border-bottom:1px solid #282d75;
    display:flex;
    align-items:center;
    padding:0 25px;
    gap:30px;
}

.logo{
    font-size:23px;
    font-weight:bold;
    white-space:nowrap;
}

.logo span{
    color:#754cff;
}

.nav{
    display:flex;
    gap:8px;
    margin-left:auto;
}

.nav button{
    border:0;
    background:transparent;
    color:white;
    padding:14px 18px;
    border-radius:15px;
    font-size:17px;
    cursor:pointer;
}

.nav button:hover,
.nav .active{
    background:#191d54;
    color:#20cfff;
}

/* ===== PAGE ===== */

.page{
    padding:25px;
}

.chat-box{
    max-width:1100px;
    height:calc(100vh - 130px);
    margin:auto;
    background:#151a62;
    border:1px solid #604cff;
    border-radius:22px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

/* ===== CHAT HEADER ===== */

.chat-header{
    min-height:80px;
    background:#10144d;
    border-bottom:1px solid #343a87;
    display:flex;
    align-items:center;
    gap:15px;
    padding:12px 20px;
}

.back-btn{
    border:0;
    background:#30378b;
    color:white;
    border-radius:13px;
    padding:12px 18px;
    cursor:pointer;
}

.avatar{
    width:50px;
    height:50px;
    border-radius:50%;
    object-fit:cover;
    background:#30378b;
}

.friend-name{
    font-size:20px;
    font-weight:bold;
}

/* ===== MESSAGE AREA ===== */

.messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
    scroll-behavior:smooth;
}

.message-row{
    display:flex;
    margin:10px 0;
}

.message-row.me{
    justify-content:flex-end;
}

.message{
    max-width:70%;
    padding:11px 15px;
    border-radius:18px;
    background:#303678;
    word-break:break-word;
}

.message-row.me .message{
    background:linear-gradient(135deg,#087fd8,#6330d9);
    border-bottom-right-radius:5px;
}

.message-row:not(.me) .message{
    border-bottom-left-radius:5px;
}

.message-time{
    font-size:10px;
    opacity:.65;
    margin-top:5px;
}

/* ===== IMAGE ===== */

.chat-image{
    max-width:260px;
    max-height:300px;
    display:block;
    border-radius:13px;
    cursor:pointer;
    object-fit:cover;
}

.download-btn{
    display:inline-block;
    margin-top:8px;
    padding:7px 10px;
    border-radius:9px;
    background:rgba(0,0,0,.25);
    color:white;
    text-decoration:none;
    font-size:13px;
}

.download-btn:hover{
    background:rgba(0,0,0,.5);
}

/* ===== TYPING ===== */

.typing{
    display:none;
    align-items:center;
    gap:8px;
    padding:7px 16px;
    color:#b8bee8;
    font-size:13px;
}

.typing.show{
    display:flex;
}

.dots{
    display:flex;
    gap:4px;
}

.dots span{
    width:6px;
    height:6px;
    background:#20cfff;
    border-radius:50%;
    animation:bounce 1.2s infinite;
}

.dots span:nth-child(2){
    animation-delay:.15s;
}

.dots span:nth-child(3){
    animation-delay:.3s;
}

@keyframes bounce{
    0%,60%,100%{
        transform:translateY(0);
        opacity:.35;
    }
    30%{
        transform:translateY(-5px);
        opacity:1;
    }
}

/* ===== INPUT ===== */

.chat-input{
    min-height:75px;
    padding:12px;
    display:flex;
    align-items:center;
    gap:10px;
    background:#10144d;
    border-top:1px solid #343a87;
}

.icon-btn{
    width:48px;
    height:48px;
    border:0;
    border-radius:50%;
    background:#30378b;
    color:white;
    font-size:21px;
    cursor:pointer;
}

#messageInput{
    flex:1;
    height:50px;
    border:1px solid #4c54a5;
    background:#080c3b;
    color:white;
    border-radius:25px;
    padding:0 18px;
    font-size:16px;
    outline:none;
}

.send-btn{
    height:48px;
    padding:0 20px;
    border:0;
    border-radius:24px;
    background:linear-gradient(135deg,#08b7ed,#6634df);
    color:white;
    font-weight:bold;
    cursor:pointer;
}

/* ===== IMAGE MODAL ===== */

.image-modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.85);
    z-index:9999;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.image-modal.show{
    display:flex;
}

.image-modal img{
    max-width:90vw;
    max-height:80vh;
    border-radius:15px;
}

.modal-buttons{
    position:absolute;
    bottom:25px;
    display:flex;
    gap:10px;
}

.modal-buttons a,
.modal-buttons button{
    border:0;
    padding:12px 18px;
    border-radius:12px;
    background:#6338df;
    color:white;
    text-decoration:none;
    cursor:pointer;
}

/* ===== MOBILE ===== */

@media(max-width:700px){

    .header{
        height:auto;
        min-height:65px;
        padding:8px 10px;
    }

    .logo{
        font-size:16px;
    }

    .nav button{
        padding:10px 8px;
        font-size:13px;
    }

    .page{
        padding:8px;
    }

    .chat-box{
        height:calc(100vh - 82px);
        border-radius:15px;
    }

    .chat-header{
        min-height:65px;
        padding:8px 10px;
    }

    .back-btn{
        padding:9px;
        font-size:12px;
    }

    .avatar{
        width:42px;
        height:42px;
    }

    .friend-name{
        font-size:17px;
    }

    .message{
        max-width:82%;
    }

    .chat-input{
        padding:8px;
    }

    .icon-btn{
        width:42px;
        height:42px;
    }

    .send-btn{
        padding:0 14px;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="logo">
        🏫 Maharnnoparam <span>School</span>
    </div>

    <nav class="nav">
        <button>🏠 หน้าแรก</button>
        <button>👥 เพื่อน</button>
        <button class="active">💬 แชท</button>
        <button>👤 โปรไฟล์</button>
    </nav>

</header>

<main class="page">

<div class="chat-box">

    <!-- HEADER CHAT -->

    <div class="chat-header">

        <button class="back-btn" onclick="alert('กลับไปรายชื่อเพื่อน')">
            ← กลับ
        </button>

        <img
            class="avatar"
            src="https://i.pravatar.cc/100?img=12"
            id="friendAvatar"
        >

        <div class="friend-name" id="friendName">
            เพื่อน
        </div>

    </div>


    <!-- MESSAGES -->

    <div class="messages" id="messages"></div>


    <!-- TYPING -->

    <div class="typing" id="typing">

        <span id="typingName">
            เพื่อน
        </span>

        กำลังพิมพ์

        <div class="dots">
            <span></span>
            <span></span>
            <span></span>
        </div>

    </div>


    <!-- INPUT -->

    <div class="chat-input">

        <button
            class="icon-btn"
            onclick="document.getElementById('imageInput').click()">
            📷
        </button>

        <input
            type="file"
            id="imageInput"
            accept="image/*"
            hidden
            onchange="sendImage(event)"
        >

        <input
            id="messageInput"
            type="text"
            placeholder="พิมพ์ข้อความ..."
            autocomplete="off"
        >

        <button
            class="send-btn"
            onclick="sendMessage()">
            ส่ง
        </button>

    </div>

</div>

</main>


<!-- IMAGE MODAL -->

<div
    class="image-modal"
    id="imageModal"
    onclick="closeImageModal(event)"
>

    <img id="bigImage">

    <div class="modal-buttons">

        <a
            id="modalDownload"
            href="#"
            download="Maharnnoparam-School-image.jpg">
            ⬇️ ดาวน์โหลด
        </a>

        <button onclick="closeImageModal()">
            ✕ ปิด
        </button>

    </div>

</div>


<script>

/* =====================================================
   ระบบแชท
===================================================== */

const messageInput =
    document.getElementById("messageInput");

const messages =
    document.getElementById("messages");

const typing =
    document.getElementById("typing");


/* เก็บข้อความ */

let chatData =
    JSON.parse(
        localStorage.getItem("maharnnoparam_chat") || "[]"
    );


/* แสดงข้อความ */

function renderMessages(){

    messages.innerHTML = "";

    chatData.forEach((msg,index)=>{

        const row =
            document.createElement("div");

        row.className =
            "message-row " +
            (msg.mine ? "me" : "");


        const bubble =
            document.createElement("div");

        bubble.className = "message";


        if(msg.type === "image"){

            const img =
                document.createElement("img");

            img.src = msg.data;

            img.className = "chat-image";

            img.onclick =
                () => openImage(msg.data);

            bubble.appendChild(img);


            const br =
                document.createElement("br");

            bubble.appendChild(br);


            /* ปุ่มดาวน์โหลด */

            const download =
                document.createElement("a");

            download.href = msg.data;

            download.download =
                "Maharnnoparam-School-image-" +
                (index+1) +
                ".jpg";

            download.className =
                "download-btn";

            download.textContent =
                "⬇️ ดาวน์โหลดรูป";

            download.onclick =
                e => e.stopPropagation();

            bubble.appendChild(download);

        }else{

            const text =
                document.createElement("div");

            text.textContent = msg.text;

            bubble.appendChild(text);

        }


        const time =
            document.createElement("div");

        time.className =
            "message-time";

        time.textContent =
            msg.time || "";

        bubble.appendChild(time);


        row.appendChild(bubble);

        messages.appendChild(row);

    });


    messages.scrollTop =
        messages.scrollHeight;
}


/* ส่งข้อความ */

function sendMessage(){

    const text =
        messageInput.value.trim();

    if(!text) return;


    chatData.push({

        mine:true,

        type:"text",

        text:text,

        time:new Date().toLocaleTimeString(
            "th-TH",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        )

    });


    saveChat();

    messageInput.value = "";

    stopTyping();


    /*
      ตัวอย่างให้เพื่อนตอบกลับ
      ถ้าต่อ Firebase ให้เปลี่ยนส่วนนี้
      เป็นการส่งข้อมูลไป Firebase
    */

    setTimeout(()=>{

        showTyping();

        setTimeout(()=>{

            hideTyping();

            chatData.push({

                mine:false,

                type:"text",

                text:"ได้รับข้อความแล้วครับ 😊",

                time:new Date().toLocaleTimeString(
                    "th-TH",
                    {
                        hour:"2-digit",
                        minute:"2-digit"
                    }
                )

            });

            saveChat();

        },1200);

    },300);

}


/* =====================================================
   ส่งรูป
===================================================== */

function sendImage(event){

    const file =
        event.target.files[0];

    if(!file) return;


    const reader =
        new FileReader();


    reader.onload = function(e){

        chatData.push({

            mine:true,

            type:"image",

            data:e.target.result,

            time:new Date().toLocaleTimeString(
                "th-TH",
                {
                    hour:"2-digit",
                    minute:"2-digit"
                }
            )

        });


        saveChat();

    };


    reader.readAsDataURL(file);

    event.target.value = "";

}


/* =====================================================
   กำลังพิมพ์ 3 จุด
===================================================== */

let typingTimer;


function showTyping(){

    typing.classList.add("show");

}


function hideTyping(){

    typing.classList.remove("show");

}


function stopTyping(){

    clearTimeout(typingTimer);

    hideTyping();

}


messageInput.addEventListener(
    "input",
    function(){

        if(messageInput.value.trim()){

            showTyping();

            clearTimeout(typingTimer);

            typingTimer =
                setTimeout(
                    hideTyping,
                    1500
                );

        }else{

            hideTyping();

        }

    }
);


/* =====================================================
   Enter ส่งข้อความ
===================================================== */

messageInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =====================================================
   บันทึก
===================================================== */

function saveChat(){

    localStorage.setItem(
        "maharnnoparam_chat",
        JSON.stringify(chatData)
    );

    renderMessages();

}


/* =====================================================
   เปิดรูปใหญ่
===================================================== */

function openImage(src){

    document
        .getElementById("bigImage")
        .src = src;


    document
        .getElementById("modalDownload")
        .href = src;


    document
        .getElementById("imageModal")
        .classList.add("show");

}


function closeImageModal(event){

    if(
        !event ||
        event.target.id === "imageModal"
    ){

        document
            .getElementById("imageModal")
            .classList.remove("show");

    }

}


/* เริ่มต้น */

renderMessages();

</script>

</body>
</html>
