<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Chat - ระบบสมาชิก</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#080b1f,#17104a,#111b3d);
    color:white;
    min-height:100vh;
}

/* Header */
header{
    height:70px;
    padding:0 6%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(10,10,35,.9);
    border-bottom:1px solid #302866;
    position:sticky;
    top:0;
    z-index:100;
    backdrop-filter:blur(12px);
}

.logo{
    color:#00d9ff;
    font-size:25px;
    font-weight:bold;
}

nav{
    display:flex;
    gap:8px;
    align-items:center;
}

nav a{
    color:#ddd;
    text-decoration:none;
    padding:10px 14px;
    border-radius:10px;
    transition:.3s;
    cursor:pointer;
}

nav a:hover, nav a.active{
    background:#302461;
    color:#00d9ff;
}

.auth-nav-btn{
    background:linear-gradient(135deg,#6847ff,#00bfff);
    color:white !important;
    border:none;
    padding:8px 16px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    margin-left:10px;
}

.user-profile-tag{
    display:flex;
    align-items:center;
    gap:8px;
    background:#1c1847;
    padding:6px 12px;
    border-radius:20px;
    border:1px solid #3d357a;
}

/* Page Control */
.page{
    display:none;
    min-height:calc(100vh - 70px);
}

.page.active{
    display:block;
}

/* Home */
.home{
    max-width:1150px;
    margin:auto;
    padding:70px 25px;
    text-align:center;
}

.hero h1{
    font-size:55px;
    margin-bottom:20px;
    background:linear-gradient(90deg,#00d9ff,#8b5cff);
    -webkit-background-clip:text;
    color:transparent;
}

.start-btn{
    margin-top:30px;
    padding:15px 30px;
    border-radius:14px;
    background:linear-gradient(135deg,#6847ff,#00bfff);
    color:white;
    font-weight:bold;
    border:none;
    cursor:pointer;
    font-size:16px;
}

/* Auth Modal Form */
.auth-container{
    max-width:400px;
    margin:60px auto;
    background:rgba(20,18,50,0.95);
    border:1px solid #3b3378;
    padding:35px 30px;
    border-radius:20px;
    box-shadow:0 15px 35px rgba(0,0,0,0.5);
}

.auth-container h2{
    margin-bottom:20px;
    text-align:center;
    color:#00d9ff;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    font-size:14px;
    color:#ccc;
}

.form-group input{
    width:100%;
    padding:12px;
    background:#100f2e;
    border:1px solid #3d357a;
    border-radius:10px;
    color:white;
    outline:none;
}

.form-group input:focus{
    border-color:#00d9ff;
}

.auth-btn{
    width:100%;
    padding:14px;
    background:linear-gradient(135deg,#6847ff,#00bfff);
    border:none;
    border-radius:10px;
    color:white;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
    margin-top:10px;
}

.auth-switch{
    text-align:center;
    margin-top:18px;
    font-size:14px;
    color:#aaa;
}

.auth-switch a{
    color:#00d9ff;
    text-decoration:none;
    cursor:pointer;
}

/* Notification */
.notification{
    position:fixed;
    right:25px;
    bottom:25px;
    background:#211d49;
    border:1px solid #6847ff;
    padding:15px 20px;
    border-radius:12px;
    display:none;
    z-index:999;
}
</style>
</head>
<body>

<header>
    <div class="logo">💬 Student Chat</div>
    <nav>
        <a onclick="showPage('home',this)" class="active">🏠 หน้าแรก</a>
        <a onclick="showPage('chat',this)">💬 ห้องแชท</a>
        
        <div id="authNavArea">
            <button class="auth-nav-btn" onclick="showPage('login')">เข้าสู่ระบบ / สมัครสมาชิก</button>
        </div>
    </nav>
</header>

<!-- HOME PAGE -->
<section id="home" class="page active">
    <div class="home">
        <div class="hero">
            <h1>Student Chat</h1>
            <p>พื้นที่พูดคุยสำหรับนักเรียน หาเพื่อน แชร์ความรู้ ถามการบ้าน</p>
            <button class="start-btn" onclick="checkAuthAndGoChat()">💬 เริ่มต้นพูดคุยเลย</button>
        </div>
    </div>
</section>

<!-- CHAT PAGE -->
<section id="chat" class="page">
    <div style="text-align:center; padding:50px;">
        <h2>💬 ห้องแชทส่วนตัวของคุณ (<span id="chatUsername">ผู้ใช้</span>)</h2>
        <p style="color:#aaa; margin-top:10px;">ระบบเชื่อมต่อบัญชีเรียบร้อย พร้อมใช้งาน!</p>
    </div>
</section>

<!-- LOGIN PAGE -->
<section id="login" class="page">
    <div class="auth-container">
        <h2>เข้าสู่ระบบ</h2>
        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>ชื่อผู้ใช้ (Username)</label>
                <input type="text" id="loginUser" required placeholder="กรอกชื่อผู้ใช้">
            </div>
            <div class="form-group">
                <label>รหัสผ่าน</label>
                <input type="password" id="loginPass" required placeholder="กรอกรหัสผ่าน">
            </div>
            <button type="submit" class="auth-btn">เข้าสู่ระบบ</button>
        </form>
        <div class="auth-switch">
            ยังไม่มีบัญชี? <a onclick="showPage('signup')">สมัครสมาชิกที่นี่</a>
        </div>
    </div>
</section>

<!-- SIGNUP PAGE -->
<section id="signup" class="page">
    <div class="auth-container">
        <h2>สมัครสมาชิก</h2>
        <form onsubmit="handleSignup(event)">
            <div class="form-group">
                <label>ตั้งชื่อผู้ใช้ (Username)</label>
                <input type="text" id="signupUser" required placeholder="เช่น Nont_Student">
            </div>
            <div class="form-group">
                <label>รหัสผ่าน</label>
                <input type="password" id="signupPass" required placeholder="อย่างน้อย 4 ตัวอักษร">
            </div>
            <button type="submit" class="auth-btn">สร้างบัญชีผู้ใช้</button>
        </form>
        <div class="auth-switch">
            มีบัญชีอยู่แล้ว? <a onclick="showPage('login')">เข้าสู่ระบบ</a>
        </div>
    </div>
</section>

<div class="notification" id="notification"></div>

<script>
// จัดการสลับหน้า
function showPage(pageId, element){
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    document.getElementById(pageId).classList.add("active");

    document.querySelectorAll("nav a").forEach(a => a.classList.remove("active"));
    if(element) element.classList.add("active");
}

// ตรวจสอบระบบบัญชี
let currentUser = JSON.parse(localStorage.getItem("activeUser")) || null;

function updateUI(){
    const authNav = document.getElementById("authNavArea");
    if(currentUser){
        authNav.innerHTML = `
            <div class="user-profile-tag">
                <span>👤 <b>${currentUser.username}</b></span>
                <a onclick="logout()" style="color:#ff7777; font-size:12px; margin-left:5px;">[ออกจากระบบ]</a>
            </div>
        `;
        document.getElementById("chatUsername").textContent = currentUser.username;
    } else {
        authNav.innerHTML = `<button class="auth-nav-btn" onclick="showPage('login')">เข้าสู่ระบบ / สมัครสมาชิก</button>`;
    }
}

// สมัครสมาชิก
function handleSignup(e){
    e.preventDefault();
    const user = document.getElementById("signupUser").value.trim();
    const pass = document.getElementById("signupPass").value.trim();

    let users = JSON.parse(localStorage.getItem("chatUsers")) || [];

    if(users.some(u => u.username === user)){
        showNotify("❌ ชื่อผู้ใช้นี้ถูกใช้ไปแล้ว");
        return;
    }

    const newUser = { username: user, password: pass };
    users.push(newUser);
    localStorage.setItem("chatUsers", JSON.stringify(users));

    // ล็อกอินอัตโนมัติหลังสมัคร
    localStorage.setItem("activeUser", JSON.stringify(newUser));
    currentUser = newUser;
    
    updateUI();
    showNotify("✅ สมัครสมาชิกสำเร็จ!");
    showPage("chat");
}

// เข้าสู่ระบบ
function handleLogin(e){
    e.preventDefault();
    const user = document.getElementById("loginUser").value.trim();
    const pass = document.getElementById("loginPass").value.trim();

    let users = JSON.parse(localStorage.getItem("chatUsers")) || [];
    const validUser = users.find(u => u.username === user && u.password === pass);

    if(validUser){
        localStorage.setItem("activeUser", JSON.stringify(validUser));
        currentUser = validUser;
        updateUI();
        showNotify("✅ เข้าสู่ระบบสำเร็จ");
        showPage("chat");
    } else {
        showNotify("❌ ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง");
    }
}

// ออกจากระบบ
function logout(){
    localStorage.removeItem("activeUser");
    currentUser = null;
    updateUI();
    showNotify("🚪 ออกจากระบบเรียบร้อย");
    showPage("home");
}

function checkAuthAndGoChat(){
    if(currentUser){
        showPage("chat");
    } else {
        showNotify("🔒 กรุณาล็อกอินก่อนเข้าใช้งาน");
        showPage("login");
    }
}

function showNotify(msg){
    const notify = document.getElementById("notification");
    notify.textContent = msg;
    notify.style.display = "block";
    setTimeout(() => notify.style.display = "none", 2500);
}

// เริ่มต้นระบบ
updateUI();
</script>
</body>
</html>
